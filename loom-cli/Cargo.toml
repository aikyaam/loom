[package]
name = "loom-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Loom command-line tool"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core = { path = "../loom-core" }
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.5", features = ["wav", "pcm", "mp3"] }
hound = "3.5"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rodio = "0.17"
